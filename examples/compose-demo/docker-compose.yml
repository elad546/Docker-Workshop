networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

services:
  web:
    build: ./web
    ports:
      - "8081:80"
    networks:
      - frontend
    depends_on:
      - api

  api:
    build: ./api
    networks:
      - frontend
      - backend
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  redis:
    image: redis:alpine
    networks:
      - backend
